; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = COM3
upload_port = COM3

; Lab 8 – aktivt program (bara EN rad utan ';'):
; build_src_filter = -<*> +<lab8_wifi_scan.cpp>          ; 8.1–8.3 scan
build_src_filter = -<*> +<lab8_wifi_connect.cpp>         ; 8.4 connect + internet
; build_src_filter = -<*> +<lab8_wifi_web_status.cpp>    ; 8.5 web status page
; build_src_filter = -<*> +<lab8_wifi_print.cpp>         ; 8.6 print scan report

lib_deps =
    mathertel/LiquidCrystal_PCF8574

