[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = COM3
upload_port = COM3

# Denna rad säger till PlatformIO att BARA kompilera just din potentiometer-fil
src_filter = +<lab1b_led_and_pot.cpp>

