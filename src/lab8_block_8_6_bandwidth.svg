<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<title>Lab 8.6 – UDP echo bandwidth and latency test (planned)</title>
<defs>
 <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#344054"/></marker>
 <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker>
</defs>
<rect width="920" height="390" fill="#ffffff"/>
<text x="20" y="32" font-size="19" font-weight="bold" fill="#17324d">Lab 8.6 – UDP echo bandwidth and latency test (planned)</text>
<rect x="20" y="80" width="260" height="170" rx="8" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.6"/>
<text x="150.0" y="102" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b5a8a">Bandwidth Test Controller</text>
<text x="150.0" y="122" font-size="11.5" text-anchor="middle" fill="#344054">board A, with LCD</text>
<text x="150.0" y="138" font-size="11.5" text-anchor="middle" fill="#344054">sizes 32 … 1472 bytes</text>
<text x="150.0" y="154" font-size="11.5" text-anchor="middle" fill="#344054">100 packets per size</text>
<text x="150.0" y="170" font-size="11.5" text-anchor="middle" fill="#344054">seq no + filler</text>
<text x="150.0" y="186" font-size="11.5" text-anchor="middle" fill="#344054">timeout 500 ms = lost</text>
<text x="150.0" y="202" font-size="11.5" text-anchor="middle" fill="#344054">min/median/avg/max RTT</text>
<rect x="360" y="110" width="200" height="100" rx="8" fill="#e8f6ec" stroke="#2f7d4a" stroke-width="1.6"/>
<text x="460.0" y="132" font-size="13" font-weight="bold" text-anchor="middle" fill="#2f7d4a">MC888 5G internet router</text>
<text x="460.0" y="152" font-size="11.5" text-anchor="middle" fill="#344054">2.4 GHz Wi-Fi</text>
<text x="460.0" y="168" font-size="11.5" text-anchor="middle" fill="#344054">same subnet</text>
<rect x="640" y="80" width="260" height="170" rx="8" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.6"/>
<text x="770.0" y="102" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b5a8a">Bandwidth Test Echo Server</text>
<text x="770.0" y="122" font-size="11.5" text-anchor="middle" fill="#344054">board B, no wiring, USB power</text>
<text x="770.0" y="138" font-size="11.5" text-anchor="middle" fill="#344054">port 5001</text>
<text x="770.0" y="154" font-size="11.5" text-anchor="middle" fill="#344054">send every packet back</text>
<text x="770.0" y="170" font-size="11.5" text-anchor="middle" fill="#344054">local subnet only</text>
<text x="770.0" y="186" font-size="11.5" text-anchor="middle" fill="#344054">max 1472 bytes</text>
<polyline points="280,140 360,140" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="320.0" y="133.0" font-size="11.5" text-anchor="middle" fill="#344054">UDP packet</text>
<polyline points="560,140 640,140" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<polyline points="640,190 560,190" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="600" y="208" font-size="11.5" text-anchor="middle" fill="#344054">echo</text>
<polyline points="360,190 280,190" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="470" y="240" font-size="11.5" text-anchor="middle" fill="#475467">every byte crosses the air 4 times</text>
<rect x="20" y="290" width="260" height="70" rx="8" fill="#f1ecfb" stroke="#6a4fb0" stroke-width="1.6"/>
<text x="150.0" y="312" font-size="14" font-weight="bold" text-anchor="middle" fill="#6a4fb0">LCD + Serial on controller</text>
<text x="150.0" y="332" font-size="11.5" text-anchor="middle" fill="#344054">BW_RESULT size=… avg_us=…</text>
<text x="150.0" y="348" font-size="11.5" text-anchor="middle" fill="#344054">kbit_s = 2 × size / avg RTT</text>
<polyline points="150,250 150,290" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="640" y="290" width="260" height="70" rx="8" fill="#fffbea" stroke="#b8a03a" stroke-width="1.6"/>
<text x="770.0" y="312" font-size="14" font-weight="bold" text-anchor="middle" fill="#b8a03a">Measures</text>
<text x="770.0" y="332" font-size="11.5" text-anchor="middle" fill="#344054">local Wi-Fi latency and</text>
<text x="770.0" y="348" font-size="11.5" text-anchor="middle" fill="#344054">throughput – not the internet</text>
</svg>
