<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<title>Lab 8.7 – print scan report over Wi-Fi Direct (planned)</title>
<defs>
 <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#344054"/></marker>
 <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker>
</defs>
<rect width="900" height="390" fill="#ffffff"/>
<text x="20" y="32" font-size="19" font-weight="bold" fill="#17324d">Lab 8.7 – print scan report over Wi-Fi Direct (planned)</text>
<rect x="20" y="90" width="200" height="90" rx="8" fill="#e8f6ec" stroke="#2f7d4a" stroke-width="1.6"/>
<text x="120.0" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#2f7d4a">Nearby networks</text>
<text x="120.0" y="132" font-size="11.5" text-anchor="middle" fill="#344054">scan as in 8.1</text>
<rect x="300" y="70" width="260" height="150" rx="8" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.6"/>
<text x="430.0" y="92" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b5a8a">ESP32-S3 – print program</text>
<text x="430.0" y="112" font-size="11.5" text-anchor="middle" fill="#344054">1. scan, build text report</text>
<text x="430.0" y="128" font-size="11.5" text-anchor="middle" fill="#344054">   (SSID text + hex, RSSI,</text>
<text x="430.0" y="144" font-size="11.5" text-anchor="middle" fill="#344054">   channel, security)</text>
<text x="430.0" y="160" font-size="11.5" text-anchor="middle" fill="#344054">2. join printer Wi-Fi Direct</text>
<text x="430.0" y="176" font-size="11.5" text-anchor="middle" fill="#344054">3. TCP 9100, send, form feed</text>
<polyline points="220,135 300,135" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="260.0" y="128.0" font-size="11.5" text-anchor="middle" fill="#344054">beacons</text>
<rect x="640" y="70" width="240" height="110" rx="8" fill="#f2f4f7" stroke="#667085" stroke-width="1.6"/>
<text x="760.0" y="92" font-size="14" font-weight="bold" text-anchor="middle" fill="#667085">HP OfficeJet 8010</text>
<text x="760.0" y="112" font-size="11.5" text-anchor="middle" fill="#344054">Wi-Fi Direct (WPA2)</text>
<text x="760.0" y="128" font-size="11.5" text-anchor="middle" fill="#344054">DIRECT-93-HP OfficeJet 8010</text>
<text x="760.0" y="144" font-size="11.5" text-anchor="middle" fill="#344054">192.168.223.1:9100</text>
<polyline points="560,125 640,125" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="600" y="145" font-size="11.5" text-anchor="middle" fill="#344054">plain text</text>
<text x="600" y="159" font-size="11.5" text-anchor="middle" fill="#344054">port 9100</text>
<rect x="640" y="230" width="240" height="80" rx="8" fill="#fffbea" stroke="#b8a03a" stroke-width="1.6"/>
<text x="760.0" y="252" font-size="14" font-weight="bold" text-anchor="middle" fill="#b8a03a">Paper</text>
<text x="760.0" y="272" font-size="11.5" text-anchor="middle" fill="#344054">readable report – purpose</text>
<text x="760.0" y="288" font-size="11.5" text-anchor="middle" fill="#344054">is a readable copy</text>
<polyline points="760,180 760,230" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="300" y="260" width="260" height="70" rx="8" fill="#fdf1e3" stroke="#b26a12" stroke-width="1.6"/>
<text x="430.0" y="282" font-size="14" font-weight="bold" text-anchor="middle" fill="#b26a12">NVS credentials</text>
<text x="430.0" y="302" font-size="11.5" text-anchor="middle" fill="#344054">printer SSID, password,</text>
<text x="430.0" y="318" font-size="11.5" text-anchor="middle" fill="#344054">IP, port (8.4b menu)</text>
<polyline points="430,260 430,220" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="20" y="360" font-size="12" text-anchor="start" fill="#344054">No internet on Wi-Fi Direct; the report never contains credentials. PC test passed; firmware planned.</text>
</svg>
