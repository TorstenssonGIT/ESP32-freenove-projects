<text x="1226.0" y="420" font-size="10.5" text-anchor="start" fill="#f04438">cable 2</text>
<text x="1226.0" y="434" font-size="10.5" text-anchor="start" fill="#f04438">motor 5 V</text>
<polyline points="190,720 1220.0,720 1220.0,710" fill="none" stroke="#475467" stroke-width="1.8"/>
<text x="220" y="712" font-size="11" text-anchor="start" fill="#475467">USB upstream: data only (Serial COM3, upload); the KVM has its own 100 W supply</text>
<text x="220" y="548" font-size="11" text-anchor="start" fill="#d92d20">Cable 1: only VBUS (red) is cut: source side to IN+, board side to IN−; GND, D+/D−, shield straight through</text>
<text x="20" y="785" font-size="11" text-anchor="start" fill="#475467">Measured 2026-11-22: at rest 5.27 V / 85 mA / 448 mW; motor turning 5.24 V / 98 mA / 514 mW (motor on its own USB-C cable, not measured; dip 0.03 V).</text>
<text x="20" y="802" font-size="11" text-anchor="start" fill="#475467">Two I2C buses: the 3.3 V Qwiic sensors on Wire1 (GPIO 47/21); the INA226 on the LCD bus (GPIO 1/2), because its 0x44 is taken by the Modulino on Wire1.</text>
<text x="20" y="819" font-size="11" text-anchor="start" fill="#475467">ULN2003 coil order in code: IN1, IN3, IN2, IN4 (AccelStepper HALF4WIRE). GPIO 4–7 are camera pins: keep the camera unplugged.</text>
<text x="20" y="836" font-size="11" text-anchor="start" fill="#475467">Pin positions are schematic; follow the labels on the boards.</text>
