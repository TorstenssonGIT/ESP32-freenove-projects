<text x="130.0" y="380" font-size="11.5" text-anchor="middle" fill="#344054">reference · VCC → 3V3, GND → GND</text>
<text x="130.0" y="396" font-size="11.5" text-anchor="middle" fill="#344054">10 kΩ pull-up on the module</text>
