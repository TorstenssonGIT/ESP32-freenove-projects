<text x="782" y="302" font-size="12" text-anchor="start" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">SDO</text>
<line x1="635" y1="298" x2="765" y2="298" stroke="#7a5af8" stroke-width="2.6"/>
