<text x="940" y="358" font-size="12" text-anchor="middle" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">VBUS</text>
<rect x="20" y="440" width="150" height="60" rx="8" fill="#f1ecfb" stroke="#6a4fb0" stroke-width="1.6"/>
<text x="95.0" y="462" font-size="14" font-weight="bold" text-anchor="middle" fill="#6a4fb0">PC / charger</text>
<text x="95.0" y="482" font-size="11.5" text-anchor="middle" fill="#344054">USB source</text>
<rect x="790" y="530" width="190" height="60" rx="8" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.6"/>
<text x="885.0" y="552" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b5a8a">Board A USB-C</text>
<text x="885.0" y="572" font-size="11.5" text-anchor="middle" fill="#344054">CH343 port (COM3)</text>
<polyline points="170,462 810,462 810,375" fill="none" stroke="#d92d20" stroke-width="2.6"/>
<polyline points="875,375 875,530" fill="none" stroke="#d92d20" stroke-width="2.6"/>
<polyline points="940,375 940,490 875,490" fill="none" stroke="#b54708" stroke-width="1.8"/>
<circle cx="875" cy="490" r="4" fill="#b54708"/>
<text x="883" y="506" font-size="10.5" text-anchor="start" fill="#b54708">VBUS to IN−</text>
<text x="240" y="456" font-size="11.5" text-anchor="start" fill="#d92d20">VBUS 5 V (red): cut, through the shunt</text>
<polyline points="170,478 700,478 700,544 790,544" fill="none" stroke="#101828" stroke-width="1.8"/>
<polyline points="170,492 694,492 694,554 790,554" fill="none" stroke="#475467" stroke-width="1.8"/>
<polyline points="170,506 688,506 688,564 790,564" fill="none" stroke="#98a2b3" stroke-width="1.8"/>
<text x="240" y="528" font-size="11" text-anchor="start" fill="#475467">GND, D+/D−, CC, shield: soldered straight through (Serial keeps working)</text>
<text x="20" y="580" font-size="11" text-anchor="start" fill="#475467">Why a second I2C bus for 3.3 V sensors: the LCD backpack runs at 5 V and may pull SDA/SCL to 5 V. Wire1 on GPIO 47/21 keeps</text>
<text x="20" y="597" font-size="11" text-anchor="start" fill="#475467">the Qwiic sensors on a pure 3.3 V bus (Wire1.begin(47, 21)); the Modulino has no SDA/SCL pull-ups, so add 10 kΩ to 3V3 on each (100 kHz).</text>
<text x="20" y="614" font-size="11" text-anchor="start" fill="#475467">Addresses: Modulino 0x45 (board V0.5+) or 0x44: check with an I2C scan; the SHT31-D then takes the other one. TMAG5273 0x35.</text>
<text x="20" y="631" font-size="11" text-anchor="start" fill="#475467">INA229: IN+ towards the source, IN− towards the board; VBUS pin on IN− (bus voltage). Logic levels follow VS = 3.3 V.</text>
<text x="20" y="648" font-size="11" text-anchor="start" fill="#475467">GPIO 39/40 are also the microSD slot&#x27;s CLK/D0: leave the slot empty. Pin positions are schematic; follow the board&#x27;s labels.</text>
</svg>
