<line x1="635" y1="202" x2="765" y2="202" stroke="#d92d20" stroke-width="2.6"/>
<circle cx="770" cy="234" r="5" fill="#12b76a" stroke="#101828"/>
<text x="782" y="238" font-size="12" text-anchor="start" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">SCLK</text>
<line x1="635" y1="234" x2="765" y2="234" stroke="#12b76a" stroke-width="2.6"/>
<circle cx="770" cy="266" r="5" fill="#f79009" stroke="#101828"/>
<text x="782" y="270" font-size="12" text-anchor="start" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">SDI</text>
