<text x="20" y="32" font-size="19" font-weight="bold" fill="#17324d">Lab 8 – board A wiring: sensors, power monitor, motor</text>
<text x="20" y="54" font-size="12.5" fill="#475467">Verified set-up: Qwiic sensors on Wire1, DHT11 on GPIO 14, INA226 on the LCD bus, ULN2003 on GPIO 4–7 with its own 5 V</text>
