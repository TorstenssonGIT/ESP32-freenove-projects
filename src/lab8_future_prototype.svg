<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<title>Lab 8 – future prototype (sketch)</title>
<defs>
 <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#344054"/></marker>
 <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker>
</defs>
<rect width="980" height="560" fill="#ffffff"/>
<text x="20" y="32" font-size="19" font-weight="bold" fill="#17324d">Lab 8 – future prototype (sketch)</text>
<text x="20" y="54" font-size="12.5" fill="#475467">Same function as the rig, built to last: enclosure, custom PCB, durable reflector, two more nodes</text>
<rect x="30" y="80" width="600" height="420" rx="16" fill="#f4f6f8" stroke="#475467" stroke-width="2.4"/>
<text x="48" y="110" font-size="15" text-anchor="start" fill="#17324d" font-weight="bold">Node A – enclosure, 3D-printed PETG (ventilated)</text>
<rect x="54" y="130" width="330" height="150" rx="8" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.6"/>
<text x="219.0" y="152" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b5a8a">Custom PCB</text>
<text x="219.0" y="172" font-size="11.5" text-anchor="middle" fill="#344054">ESP32-S3 module (Wi-Fi 2.4 GHz)</text>
<text x="219.0" y="188" font-size="11.5" text-anchor="middle" fill="#344054">INA226 power monitor</text>
<text x="219.0" y="204" font-size="11.5" text-anchor="middle" fill="#344054">ULN2003 motor driver</text>
<text x="219.0" y="220" font-size="11.5" text-anchor="middle" fill="#344054">JST-SH (Qwiic) connectors, USB-C 5 V</text>
<rect x="410" y="130" width="196" height="70" rx="8" fill="#f2f4f7" stroke="#667085" stroke-width="1.6"/>
<text x="508.0" y="152" font-size="14" font-weight="bold" text-anchor="middle" fill="#667085">Display</text>
<text x="508.0" y="172" font-size="11.5" text-anchor="middle" fill="#344054">OLED or LCD, on the lid</text>
<rect x="410" y="215" width="196" height="65" rx="8" fill="#f1ecfb" stroke="#6a4fb0" stroke-width="1.6"/>
<text x="508.0" y="237" font-size="14" font-weight="bold" text-anchor="middle" fill="#6a4fb0">USB-C 5 V</text>
<text x="508.0" y="257" font-size="11.5" text-anchor="middle" fill="#344054">motor on its own branch</text>
<circle cx="260" cy="400" r="70" fill="none" stroke="#98a2b3" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M 260 330 A 70 70 0 0 1 260 470" fill="none" stroke="#b0b7c3" stroke-width="9"/>
<circle cx="260" cy="400" r="9" fill="#2b5a8a"/>
<text x="260" y="382" font-size="10.5" text-anchor="middle" fill="#2b5a8a">antenna</text>
<text x="260" y="492" font-size="11" text-anchor="middle" fill="#344054">Reflector: PETG half-cylinder, aluminium tape, r = λ/4</text>
<text x="178" y="390" font-size="11" text-anchor="end" fill="#344054">28BYJ-48</text>
<text x="178" y="406" font-size="10.5" text-anchor="end" fill="#667085">printed bracket</text>
<rect x="410" y="310" width="196" height="60" rx="8" fill="#f2f4f7" stroke="#667085" stroke-width="1.6"/>
<text x="508.0" y="332" font-size="14" font-weight="bold" text-anchor="middle" fill="#667085">Hall index</text>
<text x="508.0" y="352" font-size="11.5" text-anchor="middle" fill="#344054">TMAG5273 + magnet</text>
<rect x="410" y="385" width="196" height="60" rx="8" fill="#f2f4f7" stroke="#667085" stroke-width="1.6"/>
<text x="508.0" y="407" font-size="14" font-weight="bold" text-anchor="middle" fill="#667085">Box climate</text>
<text x="508.0" y="427" font-size="11.5" text-anchor="middle" fill="#344054">HS3003 (antenna conditions)</text>
<rect x="690" y="330" width="220" height="70" rx="8" fill="#f2f4f7" stroke="#667085" stroke-width="1.6"/>
<text x="800.0" y="352" font-size="14" font-weight="bold" text-anchor="middle" fill="#667085">Climate sensor outside</text>
<text x="800.0" y="372" font-size="11.5" text-anchor="middle" fill="#344054">SHT31-D on a Qwiic cable</text>
<polyline points="630,365 690,365" fill="none" stroke="#344054" stroke-width="2.2"/>
<text x="640" y="358" font-size="10.5" text-anchor="start" fill="#344054">Qwiic</text>
<rect x="700" y="90" width="200" height="75" rx="8" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="800.0" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b5a8a">Node B</text>
<text x="800.0" y="132" font-size="11.5" text-anchor="middle" fill="#344054">ESP32-S3 + PIR + INA226</text>
<text x="800.0" y="148" font-size="11.5" text-anchor="middle" fill="#344054">power bank or USB</text>
<rect x="700" y="470" width="200" height="75" rx="8" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="800.0" y="492" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b5a8a">Node C</text>
<text x="800.0" y="512" font-size="11.5" text-anchor="middle" fill="#344054">ESP32-S3 + PIR</text>
<text x="800.0" y="528" font-size="11.5" text-anchor="middle" fill="#344054">power bank or USB</text>
<polyline points="630,140 700,127" fill="none" stroke="#2f7d4a" stroke-width="2.2" stroke-dasharray="7 5"/>
<polyline points="630,460 700,507" fill="none" stroke="#2f7d4a" stroke-width="2.2" stroke-dasharray="7 5"/>
<polyline points="900,127 950,127 950,507 900,507" fill="none" stroke="#2f7d4a" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="940" y="215" font-size="11" text-anchor="end" fill="#2f7d4a" font-weight="bold">Wi-Fi links:</text>
<text x="940" y="231" font-size="10.5" text-anchor="end" fill="#2f7d4a">slots on NTP time</text>
<text x="30" y="540" font-size="11" text-anchor="start" fill="#475467">Sketch only: dimensions follow the rig (cylinder Ø 6.2 cm, ≥ 6 cm high). Dashed = later nodes.</text>
</svg>
