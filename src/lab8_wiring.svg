<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<title>Lab 8 – wiring</title>
<defs>
 <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#344054"/></marker>
 <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker>
</defs>
<rect width="900" height="550" fill="#ffffff"/>
<text x="20" y="32" font-size="19" font-weight="bold" fill="#17324d">Lab 8 – wiring</text>
<text x="20" y="54" font-size="12.5" fill="#475467">Same hardware for all Lab 8 steps; Wi-Fi is built into the ESP32-S3</text>
<rect x="300" y="90" width="240" height="300" rx="8" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.6"/>
<text x="420.0" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b5a8a">Freenove ESP32-S3-WROOM</text>
<text x="420.0" y="132" font-size="11.5" text-anchor="middle" fill="#344054">board A: Bandwidth Test Controller</text>
<circle cx="300" cy="180" r="5" fill="#101828" stroke="#101828"/>
<text x="312" y="184" font-size="12" text-anchor="start" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">GND</text>
<circle cx="300" cy="212" r="5" fill="#d92d20" stroke="#101828"/>
<text x="312" y="216" font-size="12" text-anchor="start" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">5V</text>
<circle cx="300" cy="244" r="5" fill="#1570ef" stroke="#101828"/>
<text x="312" y="248" font-size="12" text-anchor="start" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO 1 (SDA)</text>
<circle cx="300" cy="276" r="5" fill="#d4a20f" stroke="#101828"/>
<text x="312" y="280" font-size="12" text-anchor="start" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO 2 (SCL)</text>
<circle cx="540" cy="180" r="5" fill="#12b76a" stroke="#101828"/>
<text x="528" y="184" font-size="12" text-anchor="end" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">GPIO 13</text>
<circle cx="540" cy="260" r="5" fill="#101828" stroke="#101828"/>
<text x="528" y="264" font-size="12" text-anchor="end" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">GND</text>
<rect x="20" y="120" width="200" height="170" rx="8" fill="#f2f4f7" stroke="#667085" stroke-width="1.6"/>
<text x="120.0" y="142" font-size="14" font-weight="bold" text-anchor="middle" fill="#667085">LCD 16x2 + PCF8574T</text>
<text x="120.0" y="162" font-size="11.5" text-anchor="middle" fill="#344054">I2C address 0x27</text>
<circle cx="220" cy="180" r="5" fill="#101828" stroke="#101828"/>
<text x="208" y="184" font-size="12" text-anchor="end" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">GND</text>
<line x1="225" y1="180" x2="295" y2="180" stroke="#101828" stroke-width="2.6"/>
<circle cx="220" cy="212" r="5" fill="#d92d20" stroke="#101828"/>
<text x="208" y="216" font-size="12" text-anchor="end" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">VCC</text>
<line x1="225" y1="212" x2="295" y2="212" stroke="#d92d20" stroke-width="2.6"/>
<circle cx="220" cy="244" r="5" fill="#1570ef" stroke="#101828"/>
<text x="208" y="248" font-size="12" text-anchor="end" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">SDA</text>
<line x1="225" y1="244" x2="295" y2="244" stroke="#1570ef" stroke-width="2.6"/>
<circle cx="220" cy="276" r="5" fill="#d4a20f" stroke="#101828"/>
<text x="208" y="280" font-size="12" text-anchor="end" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">SCL</text>
<line x1="225" y1="276" x2="295" y2="276" stroke="#d4a20f" stroke-width="2.6"/>
<line x1="545" y1="180" x2="600" y2="180" stroke="#12b76a" stroke-width="2.6"/>
<rect x="600" y="171" width="55" height="18" rx="3" fill="#fff" stroke="#344054" stroke-width="1.6"/>
<text x="627" y="164" font-size="11.5" text-anchor="middle" fill="#344054">resistor</text>
<text x="627" y="206" font-size="11" text-anchor="middle" fill="#475467">e.g. 220 Ω</text>
<line x1="655" y1="180" x2="695" y2="180" stroke="#12b76a" stroke-width="2.6"/>
<polygon points="695,167 695,193 719,180" fill="#fde272" stroke="#344054" stroke-width="1.6"/>
<line x1="719" y1="167" x2="719" y2="193" stroke="#344054" stroke-width="2"/>
<text x="707" y="158" font-size="11.5" text-anchor="middle" fill="#344054" font-weight="bold">yellow LED</text>
<text x="691" y="226" font-size="10.5" text-anchor="end" fill="#475467">anode (+)</text>
<text x="725" y="226" font-size="10.5" text-anchor="start" fill="#475467">cathode (−)</text>
<polyline points="719,180 765,180 765,260 545,260" fill="none" stroke="#101828" stroke-width="2.6"/>
<rect x="392.0" y="384" width="56" height="16" rx="4" fill="#d0d5dd" stroke="#667085"/>
<text x="456.0" y="416" font-size="11.5" text-anchor="start" fill="#344054" font-weight="bold">USB-C</text>
<polyline points="420.0,400 420.0,440" fill="none" stroke="#344054" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
<rect x="320.0" y="440" width="200" height="56" rx="8" fill="#f1ecfb" stroke="#6a4fb0" stroke-width="1.6"/>
<text x="420.0" y="462" font-size="14" font-weight="bold" text-anchor="middle" fill="#6a4fb0">PC (COM3)</text>
<text x="420.0" y="482" font-size="11.5" text-anchor="middle" fill="#344054">power, upload, Serial</text>
<text x="20" y="330" font-size="12.5" text-anchor="start" fill="#17324d" font-weight="bold">Connections (unchanged from Lab 6B)</text>
<rect x="20" y="342" width="12" height="12" fill="#101828"/>
<text x="40" y="352" font-size="11.5" text-anchor="start" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">LCD GND     → GND</text>
<rect x="20" y="360" width="12" height="12" fill="#d92d20"/>
<text x="40" y="370" font-size="11.5" text-anchor="start" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">LCD VCC     → 5V</text>
<rect x="20" y="378" width="12" height="12" fill="#1570ef"/>
<text x="40" y="388" font-size="11.5" text-anchor="start" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">LCD SDA     → GPIO 1</text>
<rect x="20" y="396" width="12" height="12" fill="#d4a20f"/>
<text x="40" y="406" font-size="11.5" text-anchor="start" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">LCD SCL     → GPIO 2</text>
<rect x="20" y="414" width="12" height="12" fill="#12b76a"/>
<text x="40" y="424" font-size="11.5" text-anchor="start" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">LED anode   → resistor → GPIO 13</text>
<rect x="20" y="432" width="12" height="12" fill="#101828"/>
<text x="40" y="442" font-size="11.5" text-anchor="start" fill="#344054" font-family="DejaVu Sans Mono, Consolas, monospace">LED cathode → GND</text>
<rect x="620" y="330" width="260" height="110" rx="8" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="750.0" y="352" font-size="13" font-weight="bold" text-anchor="middle" fill="#2b5a8a">Bandwidth Test Echo Server</text>
<text x="750.0" y="372" font-size="11.5" text-anchor="middle" fill="#344054">board B (8.6): second Freenove ESP32-S3</text>
<text x="750.0" y="388" font-size="11.5" text-anchor="middle" fill="#344054">USB-C power only</text>
<text x="750.0" y="404" font-size="11.5" text-anchor="middle" fill="#344054">no wiring, no LCD</text>
<text x="750.0" y="420" font-size="11.5" text-anchor="middle" fill="#344054">Wi-Fi: same network as board A</text>
<text x="20" y="530" font-size="11" text-anchor="start" fill="#667085">Pin positions are schematic; use the labels on the board. Check VCC and the resistor value against your Lab 6B wiring.</text>
</svg>
