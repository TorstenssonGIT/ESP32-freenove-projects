<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="385" viewBox="0 0 1160 385" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<title>Lab 8 radar phase 1 – timing of one angle cycle</title>
<rect width="1160" height="385" fill="#ffffff"/>
<text x="20" y="32" font-size="19" text-anchor="start" fill="#17324d" font-weight="bold">Radar phase 1 – timing of one angle cycle (6 s)</text>
<text x="20" y="54" font-size="12.5" text-anchor="start" fill="#475467">One board, router as fixed source; time-triggered on UTC</text>
<line x1="170.0" y1="90" x2="170.0" y2="290" stroke="#eaecf0"/>
<text x="170.0" y="308" font-size="10.5" text-anchor="middle" fill="#667085">0 s</text>
<line x1="330.0" y1="90" x2="330.0" y2="290" stroke="#eaecf0"/>
<text x="330.0" y="308" font-size="10.5" text-anchor="middle" fill="#667085">1 s</text>
<line x1="490.0" y1="90" x2="490.0" y2="290" stroke="#eaecf0"/>
<text x="490.0" y="308" font-size="10.5" text-anchor="middle" fill="#667085">2 s</text>
<line x1="650.0" y1="90" x2="650.0" y2="290" stroke="#eaecf0"/>
<text x="650.0" y="308" font-size="10.5" text-anchor="middle" fill="#667085">3 s</text>
<line x1="810.0" y1="90" x2="810.0" y2="290" stroke="#eaecf0"/>
<text x="810.0" y="308" font-size="10.5" text-anchor="middle" fill="#667085">4 s</text>
<line x1="970.0" y1="90" x2="970.0" y2="290" stroke="#eaecf0"/>
<text x="970.0" y="308" font-size="10.5" text-anchor="middle" fill="#667085">5 s</text>
<line x1="1130.0" y1="90" x2="1130.0" y2="290" stroke="#eaecf0"/>
<text x="1130.0" y="308" font-size="10.5" text-anchor="middle" fill="#667085">6 s</text>
<text x="20" y="120" font-size="12.5" text-anchor="start" fill="#17324d" font-weight="bold">Motor</text>
<text x="20" y="170" font-size="12.5" text-anchor="start" fill="#17324d" font-weight="bold">Radio (listen)</text>
<text x="20" y="220" font-size="12.5" text-anchor="start" fill="#17324d" font-weight="bold">Sensors</text>
<text x="20" y="270" font-size="12.5" text-anchor="start" fill="#17324d" font-weight="bold">Analyse / network</text>
<rect x="170.0" y="100" width="128.0" height="30" fill="#2b6cb0" stroke="#98a2b3" stroke-width="0.8"/>
<text x="234.0" y="119.0" font-size="11" text-anchor="middle" fill="#fff">step to next angle</text>
<rect x="298.0" y="100" width="32.0" height="30" fill="#e4e7ec" stroke="#98a2b3" stroke-width="0.8"/>
<rect x="330.0" y="100" width="800.0" height="30" fill="#f7f8fa" stroke="#98a2b3" stroke-width="0.8"/>
<text x="730.0" y="119.0" font-size="11" text-anchor="middle" fill="#667085">coils off – reflector at rest</text>
<rect x="170.0" y="150" width="160.0" height="30" fill="#f7f8fa" stroke="#98a2b3" stroke-width="0.8"/>
<text x="250.0" y="169.0" font-size="11" text-anchor="middle" fill="#667085">ignored</text>
<rect x="330.0" y="150" width="640.0" height="30" fill="#c6f0d4" stroke="#98a2b3" stroke-width="0.8"/>
<text x="650.0" y="169.0" font-size="11" text-anchor="middle" fill="#1f5f37">record router beacons: RSSI, channel, UTC (≈ 39 beacons)</text>
<rect x="970.0" y="150" width="160.0" height="30" fill="#f7f8fa" stroke="#98a2b3" stroke-width="0.8"/>
<rect x="170.0" y="200" width="960.0" height="30" fill="#ffffff" stroke="#98a2b3" stroke-width="0.8"/>
<line x1="170.0" y1="200" x2="170.0" y2="209" stroke="#12b76a" stroke-width="2.5"/>
<line x1="330.0" y1="200" x2="330.0" y2="209" stroke="#12b76a" stroke-width="2.5"/>
<line x1="490.0" y1="200" x2="490.0" y2="209" stroke="#12b76a" stroke-width="2.5"/>
<line x1="650.0" y1="200" x2="650.0" y2="209" stroke="#12b76a" stroke-width="2.5"/>
<line x1="810.0" y1="200" x2="810.0" y2="209" stroke="#12b76a" stroke-width="2.5"/>
<line x1="970.0" y1="200" x2="970.0" y2="209" stroke="#12b76a" stroke-width="2.5"/>
<text x="194.0" y="224" font-size="10.5" text-anchor="start" fill="#1f5f37">HS3003, INA229 every full second; DHT11 every 2 s</text>
<rect x="170.0" y="250" width="800.0" height="30" fill="#f7f8fa" stroke="#98a2b3" stroke-width="0.8"/>
<text x="570.0" y="269.0" font-size="11" text-anchor="middle" fill="#667085">radio quiet: no web, no upload</text>
<rect x="970.0" y="250" width="64.0" height="30" fill="#e2d9f7" stroke="#98a2b3" stroke-width="0.8"/>
<text x="1002.0" y="269.0" font-size="11" text-anchor="middle" fill="#4b3a8f">median</text>
<rect x="1034.0" y="250" width="96.0" height="30" fill="#dbe8f8" stroke="#98a2b3" stroke-width="0.8"/>
<text x="1082.0" y="269.0" font-size="11" text-anchor="middle" fill="#1d4a7a">batch, web</text>
<line x1="330.0" y1="96" x2="330.0" y2="134" stroke="#b42318" stroke-width="2"/>
<polygon points="325.0,90 335.0,90 330.0,97" fill="#b42318"/>
<text x="334.0" y="88" font-size="10" text-anchor="start" fill="#b42318">at rest</text>
<line x1="970.0" y1="146" x2="970.0" y2="184" stroke="#b42318" stroke-width="2"/>
<polygon points="965.0,140 975.0,140 970.0,147" fill="#b42318"/>
<text x="966.0" y="138" font-size="10" text-anchor="end" fill="#b42318">window ends</text>
<line x1="1034.0" y1="246" x2="1034.0" y2="284" stroke="#b42318" stroke-width="2"/>
<polygon points="1029.0,240 1039.0,240 1034.0,247" fill="#b42318"/>
<text x="1038.0" y="238" font-size="10" text-anchor="start" fill="#b42318">result</text>
<text x="20" y="345" font-size="11" text-anchor="start" fill="#475467">Cycle n starts when UTC mod 6 s = 0; n = floor(UTC / 6 s) = batch number. One sweep = 24 angles (15° steps, 360°) = 144 s, starting when UTC mod 144 s = 0.</text>
<text x="20" y="365" font-size="11" text-anchor="start" fill="#475467">Angles are always approached in the same direction (backlash). No internet check in radar mode.</text>
</svg>
