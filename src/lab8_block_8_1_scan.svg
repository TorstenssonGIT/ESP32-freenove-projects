<svg xmlns="http://www.w3.org/2000/svg" width="920" height="370" viewBox="0 0 920 370" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<title>Lab 8.1–8.3 – Wi-Fi scan</title>
<defs>
 <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#344054"/></marker>
 <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker>
</defs>
<rect width="920" height="370" fill="#ffffff"/>
<text x="20" y="32" font-size="19" font-weight="bold" fill="#17324d">Lab 8.1–8.3 – Wi-Fi scan</text>
<rect x="20" y="90" width="200" height="110" rx="8" fill="#e8f6ec" stroke="#2f7d4a" stroke-width="1.6"/>
<text x="120.0" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#2f7d4a">Nearby Wi-Fi networks</text>
<text x="120.0" y="132" font-size="11.5" text-anchor="middle" fill="#344054">routers broadcast</text>
<text x="120.0" y="148" font-size="11.5" text-anchor="middle" fill="#344054">beacons: SSID, channel,</text>
<text x="120.0" y="164" font-size="11.5" text-anchor="middle" fill="#344054">security mode</text>
<rect x="330" y="80" width="240" height="130" rx="8" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.6"/>
<text x="450.0" y="102" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b5a8a">ESP32-S3 – lab8_wifi_scan</text>
<text x="450.0" y="122" font-size="11.5" text-anchor="middle" fill="#344054">station mode, NOT joined</text>
<text x="450.0" y="138" font-size="11.5" text-anchor="middle" fill="#344054">scan all 2.4 GHz channels</text>
<text x="450.0" y="154" font-size="11.5" text-anchor="middle" fill="#344054">every 15 s</text>
<text x="450.0" y="170" font-size="11.5" text-anchor="middle" fill="#344054">LED on while scanning</text>
<polyline points="220,145 330,145" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="275" y="117" font-size="11.5" text-anchor="middle" fill="#344054">beacons (radio)</text>
<text x="275" y="131" font-size="11.5" text-anchor="middle" fill="#344054">listen only</text>
<rect x="680" y="70" width="200" height="70" rx="8" fill="#f2f4f7" stroke="#667085" stroke-width="1.6"/>
<text x="780.0" y="92" font-size="14" font-weight="bold" text-anchor="middle" fill="#667085">LCD 16x2</text>
<text x="780.0" y="112" font-size="11.5" text-anchor="middle" fill="#344054">count, then SSID /</text>
<text x="780.0" y="128" font-size="11.5" text-anchor="middle" fill="#344054">RSSI / channel</text>
<rect x="680" y="160" width="200" height="70" rx="8" fill="#f1ecfb" stroke="#6a4fb0" stroke-width="1.6"/>
<text x="780.0" y="182" font-size="14" font-weight="bold" text-anchor="middle" fill="#6a4fb0">Serial (USB)</text>
<text x="780.0" y="202" font-size="11.5" text-anchor="middle" fill="#344054">SCAN_BEGIN … AP … SCAN_END</text>
<text x="780.0" y="218" font-size="11.5" text-anchor="middle" fill="#344054">ssid_hex + ssid text</text>
<polyline points="570,115 680,105" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="625.0" y="103.0" font-size="11.5" text-anchor="middle" fill="#344054">I2C</text>
<polyline points="570,175 680,195" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="625.0" y="178.0" font-size="11.5" text-anchor="middle" fill="#344054">115200 baud</text>
<rect x="660" y="270" width="240" height="80" rx="8" fill="#f1ecfb" stroke="#6a4fb0" stroke-width="1.6"/>
<text x="780.0" y="292" font-size="14" font-weight="bold" text-anchor="middle" fill="#6a4fb0">PC: smoke-test</text>
<text x="780.0" y="312" font-size="11.5" text-anchor="middle" fill="#344054">lab8_wifi_scan_smoke_test.py</text>
<text x="780.0" y="328" font-size="11.5" text-anchor="middle" fill="#344054">checks protocol, lists OPEN</text>
<polyline points="780,230 780,270" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="20" y="300" font-size="12" text-anchor="start" fill="#344054">Steps 8.1–8.3. The ESP32 never joins a scanned network,</text>
<text x="20" y="318" font-size="12" text-anchor="start" fill="#344054">not even open ones.</text>
</svg>
