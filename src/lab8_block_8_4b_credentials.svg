<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<title>Lab 8.4b – credentials in NVS (XOR-obfuscated)</title>
<defs>
 <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#344054"/></marker>
 <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker>
</defs>
<rect width="880" height="400" fill="#ffffff"/>
<text x="20" y="32" font-size="19" font-weight="bold" fill="#17324d">Lab 8.4b – credentials in NVS (XOR-obfuscated)</text>
<rect x="20" y="90" width="200" height="110" rx="8" fill="#f1ecfb" stroke="#6a4fb0" stroke-width="1.6"/>
<text x="120.0" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#6a4fb0">PC serial monitor</text>
<text x="120.0" y="132" font-size="11.5" text-anchor="middle" fill="#344054">press c within 3 s</text>
<text x="120.0" y="148" font-size="11.5" text-anchor="middle" fill="#344054">menu 1–4, 0</text>
<text x="120.0" y="164" font-size="11.5" text-anchor="middle" fill="#344054">password echoed as *</text>
<rect x="300" y="70" width="250" height="150" rx="8" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.6"/>
<text x="425.0" y="92" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b5a8a">lab8_credentials.h</text>
<text x="425.0" y="112" font-size="11.5" text-anchor="middle" fill="#344054">menu + input validation</text>
<text x="425.0" y="128" font-size="11.5" text-anchor="middle" fill="#344054">SSID 1–32, password 8–63</text>
<text x="425.0" y="144" font-size="11.5" text-anchor="middle" fill="#344054">putSecret(): XOR</text>
<text x="425.0" y="160" font-size="11.5" text-anchor="middle" fill="#344054">getSecret(): XOR back</text>
<polyline points="220,145 300,145" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="260.0" y="138.0" font-size="11.5" text-anchor="middle" fill="#344054">typed once</text>
<rect x="630" y="70" width="230" height="100" rx="8" fill="#fdf1e3" stroke="#b26a12" stroke-width="1.6"/>
<text x="745.0" y="92" font-size="14" font-weight="bold" text-anchor="middle" fill="#b26a12">Keystream</text>
<text x="745.0" y="112" font-size="11.5" text-anchor="middle" fill="#344054">xorshift32 seeded from</text>
<text x="745.0" y="128" font-size="11.5" text-anchor="middle" fill="#344054">FNV-1a(salt + eFuse MAC</text>
<text x="745.0" y="144" font-size="11.5" text-anchor="middle" fill="#344054">+ key name)</text>
<polyline points="550,120 630,120" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="590.0" y="113.0" font-size="11.5" text-anchor="middle" fill="#344054">seed</text>
<rect x="300" y="280" width="250" height="90" rx="8" fill="#fdf1e3" stroke="#b26a12" stroke-width="1.6"/>
<text x="425.0" y="302" font-size="14" font-weight="bold" text-anchor="middle" fill="#b26a12">NVS in flash</text>
<text x="425.0" y="322" font-size="11.5" text-anchor="middle" fill="#344054">namespace lab8wifi</text>
<text x="425.0" y="338" font-size="11.5" text-anchor="middle" fill="#344054">router_ssid, router_pass,</text>
<text x="425.0" y="354" font-size="11.5" text-anchor="middle" fill="#344054">printer_* (obfuscated bytes)</text>
<polyline points="400,220 400,280" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="392" y="255" font-size="11.5" text-anchor="end" fill="#344054">write</text>
<polyline points="470,280 470,220" fill="none" stroke="#344054" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="478" y="255" font-size="11.5" text-anchor="start" fill="#344054">read at boot</text>
<rect x="630" y="280" width="230" height="90" rx="8" fill="#fdecec" stroke="#b42318" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="745.0" y="302" font-size="14" font-weight="bold" text-anchor="middle" fill="#b42318">Not protected against</text>
<text x="745.0" y="322" font-size="11.5" text-anchor="middle" fill="#344054">source code + MAC (esptool)</text>
<text x="745.0" y="338" font-size="11.5" text-anchor="middle" fill="#344054">attacker&#x27;s own firmware</text>
<text x="745.0" y="354" font-size="11.5" text-anchor="middle" fill="#344054">→ level 3/4 documented</text>
<rect x="20" y="280" width="200" height="90" rx="8" fill="#fffbea" stroke="#b8a03a" stroke-width="1.6"/>
<text x="120.0" y="302" font-size="14" font-weight="bold" text-anchor="middle" fill="#b8a03a">Never stored</text>
<text x="120.0" y="322" font-size="11.5" text-anchor="middle" fill="#344054">in git, source code,</text>
<text x="120.0" y="338" font-size="11.5" text-anchor="middle" fill="#344054">firmware .bin or PC files</text>
</svg>
