<text x="838.5" y="261" font-size="10.5" text-anchor="middle" fill="#344054">INA226: 41.6 mA at rest</text>
<rect x="919.0" y="226" width="145.0" height="46" rx="7" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
