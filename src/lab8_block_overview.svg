<rect width="1430" height="870" fill="#ffffff"/>
<text x="20" y="32" font-size="19" font-weight="bold" fill="#17324d">Lab 8 – Wi-Fi radar: overview of boards, parts and steps</text>
<text x="20" y="54" font-size="12.5" fill="#475467">Goal: find the direction to a radio source and detect movement. Boards talk over Wi-Fi; only the router uses 5G.</text>
<rect x="20" y="80" width="700" height="600" rx="12" fill="#f8fafc" stroke="#2b5a8a" stroke-width="2.2"/>
<text x="36" y="108" font-size="16" text-anchor="start" fill="#17324d" font-weight="bold">Board A – controller and radar master</text>
<text x="36" y="127" font-size="11.5" text-anchor="start" fill="#475467">Freenove ESP32-S3 N8R8 · lab8-esp32 · COM3 · on the bench, shoebox and reflector</text>
<rect x="36" y="144" width="290" height="214" rx="8" fill="#ffffff" stroke="#98a2b3" stroke-width="1.2"/>
<text x="48" y="164" font-size="12.5" text-anchor="start" fill="#344054" font-weight="bold">Bill of Materials</text>
<text x="48" y="184" font-size="11" text-anchor="start" fill="#344054">• ESP32-S3, 8 MB flash + 8 MB PSRAM</text>
<text x="48" y="200" font-size="11" text-anchor="start" fill="#344054">• LCD 16×2 + PCF8574T (LCD bus, 0x27)</text>
<text x="48" y="216" font-size="11" text-anchor="start" fill="#344054">• Yellow LED (GPIO 13)</text>
<text x="48" y="232" font-size="11" text-anchor="start" fill="#344054">• INA226 power monitor (LCD bus, 0x44)</text>
<text x="48" y="248" font-size="11" text-anchor="start" fill="#344054">• Modulino Thermo HS3003 (Qwiic, 0x44)</text>
<text x="48" y="264" font-size="11" text-anchor="start" fill="#344054">• TMAG5273 Hall index (Qwiic, 0x35)</text>
<text x="48" y="280" font-size="11" text-anchor="start" fill="#344054">• SHT31-D with heater (Qwiic, 0x45)</text>
<text x="48" y="296" font-size="11" text-anchor="start" fill="#344054">• DHT11 room reference (GPIO 14)</text>
<text x="48" y="312" font-size="11" text-anchor="start" fill="#344054">• ULN2003 + 28BYJ-48 (GPIO 4–7)</text>
<text x="48" y="328" font-size="11" text-anchor="start" fill="#344054">• Reflector: half foil cylinder, λ/4</text>
<text x="48" y="344" font-size="11" text-anchor="start" fill="#344054">• Index magnet Ø5×3 mm</text>
<rect x="338" y="144" width="180" height="46" rx="7" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.5"/>
<text x="428.0" y="162" font-size="12" text-anchor="middle" fill="#2b5a8a" font-weight="bold">8.1–8.3 Scan</text>
<text x="428.0" y="179" font-size="10.5" text-anchor="middle" fill="#344054">networks on LCD + Serial</text>
<rect x="338" y="198" width="180" height="46" rx="7" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.5"/>
<text x="428.0" y="216" font-size="12" text-anchor="middle" fill="#2b5a8a" font-weight="bold">8.4 Connect</text>
<text x="428.0" y="233" font-size="10.5" text-anchor="middle" fill="#344054">internet check, HTTP 204</text>
<rect x="338" y="252" width="180" height="46" rx="7" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.5"/>
<text x="428.0" y="270" font-size="12" text-anchor="middle" fill="#2b5a8a" font-weight="bold">8.4b Credentials</text>
<text x="428.0" y="287" font-size="10.5" text-anchor="middle" fill="#344054">NVS, XOR, Serial menu</text>
<rect x="338" y="306" width="180" height="46" rx="7" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.5"/>
<text x="428.0" y="324" font-size="12" text-anchor="middle" fill="#2b5a8a" font-weight="bold">8.5 Web status page</text>
<text x="428.0" y="341" font-size="10.5" text-anchor="middle" fill="#344054">local only, JSON, NTP</text>
<rect x="338" y="360" width="180" height="46" rx="7" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.5"/>
<text x="428.0" y="378" font-size="12" text-anchor="middle" fill="#2b5a8a" font-weight="bold">Sensor test</text>
<text x="428.0" y="395" font-size="10.5" text-anchor="middle" fill="#344054">HS3003 + DHT11</text>
<rect x="338" y="414" width="180" height="46" rx="7" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.5"/>
<text x="428.0" y="432" font-size="12" text-anchor="middle" fill="#2b5a8a" font-weight="bold">Motor + sensor test</text>
<text x="428.0" y="449" font-size="10.5" text-anchor="middle" fill="#344054">index, 3 hygrometers, INA226</text>
<rect x="530" y="144" width="180" height="46" rx="7" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="620.0" y="162" font-size="12" text-anchor="middle" fill="#2b5a8a" font-weight="bold">Radar phase 1</text>
<text x="620.0" y="179" font-size="10.5" text-anchor="middle" fill="#344054">direction to the router</text>
<rect x="530" y="198" width="180" height="46" rx="7" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="620.0" y="216" font-size="12" text-anchor="middle" fill="#2b5a8a" font-weight="bold">8.5b Graphs + history</text>
<text x="620.0" y="233" font-size="10.5" text-anchor="middle" fill="#344054">ring buffer, CSV</text>
<rect x="530" y="252" width="180" height="46" rx="7" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="620.0" y="270" font-size="12" text-anchor="middle" fill="#2b5a8a" font-weight="bold">8.6 Bandwidth test</text>
<text x="620.0" y="287" font-size="10.5" text-anchor="middle" fill="#344054">controller: UDP to B</text>
<rect x="530" y="306" width="180" height="46" rx="7" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="620.0" y="324" font-size="12" text-anchor="middle" fill="#2b5a8a" font-weight="bold">8.6b Humidity test</text>
<text x="620.0" y="341" font-size="10.5" text-anchor="middle" fill="#344054">steam, SHT31-D</text>
<rect x="530" y="360" width="180" height="46" rx="7" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="620.0" y="378" font-size="12" text-anchor="middle" fill="#2b5a8a" font-weight="bold">8.7 Print report</text>
<text x="620.0" y="395" font-size="10.5" text-anchor="middle" fill="#344054">Wi-Fi Direct, port 9100</text>
<rect x="530" y="414" width="180" height="46" rx="7" fill="#e7f0fb" stroke="#2b5a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="620.0" y="432" font-size="12" text-anchor="middle" fill="#2b5a8a" font-weight="bold">6 LCD text form</text>
<text x="620.0" y="449" font-size="10.5" text-anchor="middle" fill="#344054">needs HTTPS first</text>
<text x="428.0" y="484" font-size="10.5" text-anchor="middle" fill="#667085">done</text>
<text x="620.0" y="484" font-size="10.5" text-anchor="middle" fill="#667085">planned</text>
<rect x="750" y="80" width="330" height="330" rx="12" fill="#f8fafc" stroke="#2b5a8a" stroke-width="2.2"/>
<text x="766" y="108" font-size="16" text-anchor="start" fill="#17324d" font-weight="bold">Board B – echo server and slave</text>
<text x="766" y="127" font-size="11.5" text-anchor="start" fill="#475467">ESP32-S3 N16R8 · lab8-echo · COM4</text>
<rect x="766" y="144" width="298" height="70" rx="8" fill="#ffffff" stroke="#98a2b3" stroke-width="1.2"/>
<text x="778" y="164" font-size="12.5" text-anchor="start" fill="#344054" font-weight="bold">Bill of Materials</text>
<text x="778" y="184" font-size="11" text-anchor="start" fill="#344054">• HC-SR501 PIR (5 V, OUT GPIO 14)</text>
<text x="778" y="200" font-size="11" text-anchor="start" fill="#344054">• INA226 (own cable, 10 kΩ pull-ups)</text>
